name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    env:
      PROJECT_PATH: APEX/APEX.xcodeproj
      SCHEME: APEX
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
      RESULT_BUNDLE_DIR: ${{ github.workspace }}/ci_results
      LOG_DIR: ${{ github.workspace }}/ci_logs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare diagnostics directories
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_BUNDLE_DIR" "$LOG_DIR"

      - name: Validate project and scheme
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG_DIR/preflight.log") 2>&1
          echo "Selected project path: $PROJECT_PATH"
          if [ ! -d "$PROJECT_PATH" ]; then
            echo "Project path does not exist: $PROJECT_PATH"
            exit 1
          fi
          echo "Confirmed project directory exists: $(pwd)/$PROJECT_PATH"

          echo "Xcode version:"
          XCODE_VERSION="$(xcodebuild -version | awk '/Xcode/{print $2}')"
          xcodebuild -version
          if [ "${XCODE_VERSION%%.*}" -lt 15 ]; then
            echo "Xcode 15+ is required for Swift 5.9/iOS 17 deployment target"
            exit 1
          fi

          echo "Project file syntax validation:"
          plutil -lint "$PROJECT_PATH/project.pbxproj"

          xcodebuild -list -project "$PROJECT_PATH" | tee "$LOG_DIR/xcodebuild-list.log"
          grep -F "${SCHEME}" "$LOG_DIR/xcodebuild-list.log" >/dev/null

      - name: Ensure diagnostic placeholders
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_BUNDLE_DIR" "$LOG_DIR"
          if ! compgen -G "$LOG_DIR/*.log" > /dev/null; then
            echo "No .log diagnostics were generated before failure." > "$LOG_DIR/README.txt"
          fi
          if ! compgen -G "$RESULT_BUNDLE_DIR/*.xcresult" > /dev/null; then
            echo "No .xcresult bundles were generated before failure." > "$RESULT_BUNDLE_DIR/README.txt"
          fi

      - name: Resolve Swift package dependencies
        run: |
          set -euo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME"

      - name: Select simulator destination
        id: sim
        run: |
          set -euo pipefail
          # Get available devices in JSON format
          DEVICES_JSON="$(xcrun simctl list devices available -j)"
          # Use Python to find an iPhone simulator
          DESTINATION="$(python3 <<'ENDPY'
import json, sys, os
data = json.loads(os.environ['DEVICES_JSON'])
devices = data.get('devices', [])
candidates = []
for runtime, devlist in devices.items():
    for d in devlist:
        if d.get('isAvailable', False) and 'iPhone' in d.get('name', ''):
            candidates.append((d['name'], d['udid'], d.get('isEnabled', True)))
enabled = [c for c in candidates if c[2]]
if enabled:
    name, udid, _ = enabled[0]
elif candidates:
    name, udid, _ = candidates[0]
else:
    print("No available iPhone simulator found", file=sys.stderr)
    sys.exit(1)
print(f"platform=iOS Simulator,UDID={udid}")
ENDPY
)"
          if [ -z "$DESTINATION" ]; then
            echo "No available iPhone simulator found"
            echo "Xcode version:"
            xcodebuild -version
            echo "Available iOS runtimes:"
            xcrun simctl list runtimes
            echo "All devices:"
            xcrun simctl list devices
            exit 1
          fi
          echo "destination=$DESTINATION" >> "$GITHUB_OUTPUT"
          echo "Using destination: $DESTINATION"
      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_BUNDLE_DIR" "$LOG_DIR"
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE_DIR/build.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$LOG_DIR/build.log"

      - name: Run unit tests
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_BUNDLE_DIR" "$LOG_DIR"
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE_DIR/tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test | tee "$LOG_DIR/test.log"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-diagnostics
          if-no-files-found: warn
          path: |
            ${{ env.LOG_DIR }}
            ${{ env.RESULT_BUNDLE_DIR }}
